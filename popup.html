<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 12px;
      background: #141414;
      color: #eee;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #fff;
    }
    input[type="file"] {
      width: 100%;
      font-size: 12px;
      margin-bottom: 10px;
      color: #ccc;
    }
    #status {
      font-size: 12px;
      color: #9a9a9a;
      margin-bottom: 12px;
      min-height: 16px;
    }
    .offset-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .offset-row span {
      font-size: 12px;
      color: #ccc;
    }
    .offset-buttons button {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 4px;
    }
    .offset-buttons button:hover {
      background: #3a3a3a;
    }
    #offsetValue {
      font-variant-numeric: tabular-nums;
    }
    #toggleBtn {
      width: 100%;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
    }
    #toggleBtn:hover {
      background: #f6121d;
    }
  </style>
</head>
<body>
  <h1>🍿 SubFlix</h1>
  <input type="file" id="fileInput" accept=".srt,.vtt" />
  <div id="status">No subtitle file loaded.</div>

  <div class="offset-row">
    <span>Offset: <span id="offsetValue">0.0s</span></span>
    <div class="offset-buttons">
      <button data-delta="-1">-1s</button>
      <button data-delta="-0.1">-0.1</button>
      <button data-delta="0.1">+0.1</button>
      <button data-delta="1">+1s</button>
    </div>
  </div>

  <button id="toggleBtn">Hide subtitles</button>

  <script src="popup.js"></script>
</body>
</html>
